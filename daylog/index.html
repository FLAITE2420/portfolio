<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private log · Matías Rathgeb</title>
<style>
  :root{--white:#ffffff;--black:#000000;--gray:#86868b;--border:#d2d2d7;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--white);color:var(--black);font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:var(--black);text-decoration:none;}
  a:hover{text-decoration:underline;}
  .wrap{max-width:720px;margin:0 auto;padding:0 22px;}
  header{padding:80px 0 30px;border-bottom:1px solid var(--border);}
  header h1{font-size:36px;line-height:1.07;letter-spacing:-0.02em;font-weight:600;}
  header p{color:var(--gray);font-size:14px;margin-top:8px;}
  .login{padding:60px 0;}
  .login label{display:block;font-size:13px;color:var(--gray);margin-bottom:10px;}
  .login input[type=password]{
    width:100%;max-width:320px;padding:12px 16px;font-size:16px;
    border:1px solid var(--border);border-radius:8px;outline:none;
    font-family:inherit;
  }
  .login input[type=password]:focus{border-color:var(--black);}
  .login button{
    margin-top:16px;display:inline-block;background:var(--black);color:var(--white);
    padding:12px 24px;border:none;border-radius:980px;font-size:14px;cursor:pointer;
  }
  .login .err{color:#a11;font-size:13px;margin-top:12px;min-height:18px;}
  .log{padding:40px 0 80px;display:none;}
  .log .item{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--border);gap:16px;}
  .log .item:hover{background:#f5f5f7;}
  .log .ccode{font-size:12px;color:var(--gray);min-width:70px;}
  .log .meta{font-size:12px;color:var(--gray);}
  .log .spacer{height:30px;}
  footer{padding:30px 0 60px;border-top:1px solid var(--border);color:var(--gray);font-size:12px;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Private log</h1>
    <p>Password required.</p>
  </div>
</header>

<div class="login" id="login">
  <div class="wrap">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="••••••••">
    <br>
    <button id="btn">Enter</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="log" id="log">
  <div class="wrap">
    <p class="tag" style="font-size:13px;color:var(--gray);letter-spacing:0.2px;margin-bottom:20px;">Daily log</p>
    <div id="items"></div>
    <div class="spacer"></div>
    <a href="/daylog/courses.html">Courses →</a>
  </div>
</div>

<footer>
  <div class="wrap">
    <p><a href="/">← Back to public site</a> · Matías Rathgeb</p>
  </div>
</footer>

<script>
  // SHA-256 of the password (client-side check). Not for real secrecy —
  // the gate keeps the log from casual eyes. Change the hash if password changes.
  var HASH = "910d9ff25a3828ce8f56a8453ec2e7a2534310a6d1003066fbeec75749e26f57";

  async function sha256(str){
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }

  function buildItems(){
    // list daily log entries (day-XXX.html present in this folder)
    var names = ["day-001.html", "day-002.html", "day-003.html", "day-004.html", "day-005.html", "day-006.html", "day-007.html", "day-008.html", "day-009.html", "day-010.html", "day-011.html", "day-012.html", "day-013.html", "day-014.html", "day-015.html", "day-016.html", "day-017.html", "day-018.html", "day-019.html", "day-020.html", "day-021.html", "day-022.html", "day-023.html", "day-024.html"];
    var items = document.getElementById("items");
    items.innerHTML = "";
    names.forEach(function(n){
      var m = n.match(/day-(\d+)\.html/);
      var label = "Day " + m[1];
      var d = document.createElement("a");
      d.href = "/daylog/" + n;
      d.className = "item";
      d.innerHTML = '<span><span class="ccode">'+label+'</span> open</span><span class="meta">entry</span>';
      items.appendChild(d);
    });
  }

  document.getElementById("btn").addEventListener("click", async function(){
    var pw = document.getElementById("pw").value;
    var h = await sha256(pw);
    if (h === HASH){
      document.getElementById("login").style.display = "none";
      document.getElementById("log").style.display = "block";
      buildItems();
    } else {
      document.getElementById("err").textContent = "Wrong password.";
    }
  });
  document.getElementById("pw").addEventListener("keydown", function(e){
    if (e.key === "Enter") document.getElementById("btn").click();
  });
</script>
</body>
</html>
