<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matías Rathgeb — Data Science student</title>
<meta name="description" content="I am learning data science, one concept at a time.">
<style>
  :root{--white:#ffffff;--black:#000000;--gray:#86868b;--border:#d2d2d7;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--white);color:var(--black);
    font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  a{color:var(--black);text-decoration:none;}
  a:hover{text-decoration:underline;}
  .wrap{max-width:980px;margin:0 auto;padding:0 22px;}

  nav{position:sticky;top:0;background:rgba(255,255,255,0.9);
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--border);z-index:100;}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:52px;}
  nav .brand{font-size:13px;letter-spacing:-0.1px;}
  nav ul{display:flex;list-style:none;gap:28px;}
  nav ul a{font-size:13px;color:var(--gray);letter-spacing:-0.1px;}
  nav ul a:hover{color:var(--black);text-decoration:none;}

  header.hero{padding:60px 0;position:relative;overflow:hidden;min-height:540px;display:flex;align-items:center;}
  header.hero .hero-kio-bg{position:absolute;left:-20px;top:50%;transform:translateY(-50%);width:min(46vw,560px);opacity:0.92;pointer-events:none;z-index:0;}
  header.hero .wrap{position:relative;z-index:1;width:100%;}
  header.hero .hero-grid{display:flex;justify-content:flex-end;}
  header.hero .hero-grid > div{max-width:44ch;}
  header.hero .glass-stage{display:none;}
  header.hero .kicker{font-size:14px;color:var(--gray);margin-bottom:16px;letter-spacing:0.2px;}
  header.hero h1{font-size:44px;line-height:1.08;letter-spacing:-0.02em;font-weight:600;}
  header.hero p.sub{margin-top:16px;font-size:17px;color:var(--gray);max-width:38ch;line-height:1.4;letter-spacing:-0.01em;}

  .glass-stage{display:flex;justify-content:center;align-items:center;}
  .glass-stage svg{width:min(44vw,560px);height:auto;}
  .koi-img{width:min(44vw,560px);height:auto;border-radius:10px;box-shadow:0 2px 2px rgba(0,0,0,0.04);}

  section{padding:110px 0;}
  section .tag{font-size:13px;color:var(--gray);letter-spacing:0.2px;margin-bottom:16px;}
  h2.sec{font-size:40px;line-height:1.07;letter-spacing:-0.015em;font-weight:600;margin-bottom:40px;}

  .year{margin-bottom:60px;}
  .year .yhead{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--black);padding-bottom:12px;margin-bottom:26px;}
  .year .yhead .yn{font-size:26px;font-weight:600;letter-spacing:-0.01em;}
  .year .yhead .yd{font-size:14px;color:var(--gray);}
  .course{display:flex;justify-content:space-between;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--border);gap:20px;}
  .course:hover{background:#f5f5f7;}
  .course .cname{font-size:16px;letter-spacing:-0.01em;font-weight:500;}
  .course .ccode{font-size:12px;color:var(--gray);min-width:56px;}
  .course .cmeta{font-size:12px;color:var(--gray);text-align:right;white-space:nowrap;}

  section.manifesto{background:var(--black);color:var(--white);}
  section.manifesto h2.sec{color:var(--white);}
  section.manifesto p.lead{font-size:19px;line-height:1.5;letter-spacing:-0.01em;max-width:60ch;margin-bottom:28px;}
  section.manifesto .rules{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--white);}
  section.manifesto .rule{background:var(--black);padding:26px 24px;}
  section.manifesto .rule .rn{font-size:12px;color:var(--gray);margin-bottom:8px;}
  section.manifesto .rule p{font-size:14px;line-height:1.5;}

  footer{padding:40px 0 80px;border-top:1px solid var(--border);}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;color:var(--gray);font-size:12px;}

  @media(max-width:768px){
    header.hero h1{font-size:34px;}
    header.hero .hero-grid{grid-template-columns:1fr;gap:24px;}
    .glass-stage svg{width:min(82vw,460px);}
    .koi-img{width:min(82vw,460px);}
    h2.sec{font-size:30px;}
    .course{flex-wrap:wrap;}
    nav ul{gap:16px;}
    section{padding:75px 0;}
  }
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin="anonymous" integrity="sha384-bdF7m0Y1IFKt9Q6xC8X9qkXn0OBriQWKyWwZKYsN05zF6P/g9OakjjL0G2Sd4pB4" src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const YEARS = [
  {n:"Year 1", d:"Fundamentals", c:[
    ["PR01","Introduction to Applied Data Science & AI","8 weeks"],
    ["PR02","Programming Fundamentals","8 weeks"],
    ["PR03","Discrete Mathematics","8 weeks"],
    ["PR04","Human-Data-Computer Interaction","8 weeks"],
    ["MA01","Machine Learning","8 weeks"],
    ["MA02","Probability & Statistics","4 weeks"],
  ]},
  {n:"Year 2", d:"Core", c:[
    ["PR05","Data Structures & Algorithms","8 weeks"],
    ["PR06","Evolutionary AI","8 weeks"],
    ["PR07","Software Engineering","7 weeks"],
    ["PR08","Data Visualisation","9 weeks"],
    ["PR09","Linear Algebra","7 weeks"],
    ["MA03","AI-Ops / MLOps & DevOps","8 weeks"],
  ]},
  {n:"Year 3", d:"Specialization", c:[
    ["PR10","Data Engineering","7 weeks"],
    ["PR11","Design of Interactive Systems","9 weeks"],
    ["PR12","Calculus","4 weeks"],
    ["MA04","Deep Learning","4 weeks"],
    ["MA05","eXtended Reality","4 weeks"],
    ["MA06","Responsible Research & Innovation","10 weeks"],
  ]},
  {n:"Year 4", d:"Advanced + Capstone", c:[
    ["MA07","Operations Research","4 weeks"],
    ["MA08","Intelligent Search","4 weeks"],
    ["ZM001","Data Science Capstone","4 weeks"],
    ["ZM002","Professional Practice","4 weeks"],
  ]},
];

function Koi(){
  const [m, setM] = React.useState({x:0, y:0});
  const ref = React.useRef(null);

  React.useEffect(() => {
    function onMove(e){
      const r = ref.current.getBoundingClientRect();
      setM({
        x: ((e.clientX - (r.left + r.width/2)) / (r.width/2)),
        y: ((e.clientY - (r.top + r.height/2)) / (r.height/2))
      });
    }
    window.addEventListener('mousemove', onMove);
    return () => window.removeEventListener('mousemove', onMove);
  }, []);

  const driftX = (m.x * 8).toFixed(1);
  const driftY = (m.y * 5).toFixed(1);

  return (
    <div className="glass-stage" ref={ref}>
      <img src="/koi.jpg" alt="koi" className="koi-img"
           style={{ transform: `translate(${driftX}px, ${driftY}px)`, transition: "transform 0.2s ease-out" }} />
    </div>
  );
}

function Nav(){
  return (
    <nav>
      <div className="wrap">
        <span className="brand">Matías Rathgeb</span>
        <ul>
          <li><a href="#about">About</a></li>
        </ul>
      </div>
    </nav>
  );
}

function Hero(){
  return (
    <header className="hero">
      <img src="/koi.jpg" alt="" className="hero-kio-bg" aria-hidden="true" />
      <div className="wrap">
        <div className="hero-grid">
          <div>
            <p className="kicker">Data Science</p>
            <h1>Learning, one day at a time.</h1>
            <p className="sub">A quiet log of daily study. Nothing more.</p>
          </div>
        </div>
      </div>
    </header>
  );
}

function Courses(){
  return (
    <section id="courses">
      <div className="wrap">
        <p className="tag">The curriculum</p>
        <h2 className="sec">Four years.<br />Twenty-two courses.</h2>
        {YEARS.map(y => (
          <div className="year" key={y.n}>
            <div className="yhead"><span className="yn">{y.n}</span><span className="yd">{y.d}</span></div>
            {y.c.map(([code,name,meta]) => (
              <div className="course" key={code}>
                <div style={{flex:1}}><span className="ccode">{code}</span> {name}</div>
                <span className="cmeta">{meta}</span>
              </div>
            ))}
          </div>
        ))}
      </div>
    </section>
  );
}

function About(){
  return (
    <section className="manifesto" id="about">
      <div className="wrap">
        <p className="tag" style={{color:"#a1a1a6"}}>About</p>
        <h2 className="sec">Slowly, daily.</h2>
        <p className="lead">I study data science. One concept at a time, day by day. I write down what I learn, and what I still do not understand.</p>
      </div>
    </section>
  );
}

function Footer(){
  return (
    <footer>
      <div className="wrap">
        <span>© 2026 Matías Rathgeb</span>
        <span>Based Netherlands.</span>
      </div>
    </footer>
  );
}

function SecretDoor(){
  const [typed, setTyped] = React.useState("");
  const [open, setOpen] = React.useState(false);
  const SECRET = "openlog";

  React.useEffect(() => {
    function onKey(e){
      if (e.key.length === 1){
        setTyped(prev => {
          const next = (prev + e.key.toLowerCase()).slice(-SECRET.length);
          if (next === SECRET) setOpen(true);
          return next;
        });
      }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  if (!open) return null;
  return (
    <div style={{
      position:"fixed", bottom:24, right:24, zIndex:1000,
      background:"#000", color:"#fff", padding:"12px 20px",
      borderRadius:980, fontSize:14
    }}>
      <a href="/daylog/" style={{color:"#fff"}}>Enter log →</a>
    </div>
  );
}
function App(){
  return (
    <>
      <Nav />
      <Hero />
      <About />
      <Footer />
      <SecretDoor />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
